name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the version bump commit can be pushed
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - name: Bump version
        run: npm version ${{ github.event.inputs.bump }} --no-git-tag-version

      - name: Read new version
        id: version
        shell: bash
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        shell: bash
        run: |
          git config user.name "ihrigb"
          git config user.email "benjamin.ihrig@gmail.com"
          git add package.json package-lock.json
          git commit -m "chore: bump version to ${{ steps.version.outputs.value }}"
          git tag "v${{ steps.version.outputs.value }}"
          git push https://x-access-token:${{ secrets.RELEASE_PAT }}@github.com/${{ github.repository }}.git main --follow-tags

      - name: Build
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: v${{ steps.version.outputs.value }}
          generate_release_notes: true
          files: |
            dist/UniFi Viewport Switcher Setup ${{ steps.version.outputs.value }}.exe
            dist/UniFi Viewport Switcher-${{ steps.version.outputs.value }}-portable.exe
